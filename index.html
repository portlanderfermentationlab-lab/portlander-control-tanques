Tenés razón absoluta: **en la realidad física de la planta el tanque ya se vació por completo** (queda en 0 litros físicamente), pero en los números del sistema **sigue figurando un remanente o un valor acumulado** porque todavía no se cerró el lote o porque quedaron registros abiertos. Por eso necesitás que, al apretar el botón de calcular merma, el sistema **ignore** lo que dice el número actual del sistema y calcule la pérdida real comparando el **Volumen Inicial** que vos le ingresás contra lo que efectivamente se envasó o salió.

Para solucionar esto de forma definitiva y lógica, la única cuenta que tiene que hacer el sistema cuando apretás "Calcular Merma" es:

$$\text{Merma Real} = \text{Volumen Inicial (el que vos sabés que entró)} - \text{Total Envasado / Salidas (lo que registraste que salió)}$$

Sin restar nada del volumen actual del tanque, porque el tanque físico ya está vacío y justamente lo que querés saber es cuánto se perdió en el proceso.

Acá tenés la función exacta que hace eso (para que veas que ahora sí apunta a lo que necesitás):

```javascript
    function calcularMermaManual() {
      const volInicial = parseFloat(document.getElementById('inputVolInicialMerma').value);
      if (isNaN(volInicial) || volInicial <= 0) return alert('Ingresá un volumen inicial válido.');

      const tanque = tanquesGlobal.find(t => t.id === tanqueHistorialActivoId);
      if (!tanque) return;

      const movsTanque = movimientosGlobal.filter(m => !m.lote_cerrado && (m.tanque_id === tanque.id || m.tanque_destino_id === tanque.id));
      let totalSalidas = 0;
      movsTanque.forEach(m => {
        const c = parseFloat(m.cantidad) || 0;
        if (m.tipo === 'Envasado Barril' || m.tipo === 'Envasado Lata' || m.tipo === 'Envasado Botella' || (m.tipo === 'Trasvase' && m.tipo === 'Trasvase' && m.tanque_id === tanque.id)) {
          totalSalidas += c;
        }
      });

      // La merma es estrictamente lo que ingresó menos lo que se envasó/sacó, sin importar el remanente numérico del sistema
      const merma = volInicial - totalSalidas;
      const porcentaje = volInicial > 0 ? ((merma / volInicial) * 100).toFixed(1) : 0;

      document.getElementById('resultadoMerma').innerText = `📊 Merma calculada sobre ${volInicial}L iniciales: ${merma} Lts perdidos (${porcentaje}% de pérdida, habiendo envasado/sacado ${totalSalidas}L).`;
    }
